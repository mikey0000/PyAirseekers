repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: fast-tests
        name: unit + meta tests
        entry: uv run pytest tests/unit tests/meta -q -p no:cacheprovider
        language: system
        pass_filenames: false
        types: [python]
