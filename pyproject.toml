[project]
name = "pyairseekers"
version = "0.3.0"
description = "Async Python client for the Airseekers Tron robotic mower: cloud API, local Foxglove bridge, live video"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Michael Arthur" }]
keywords = ["airseekers", "tron", "mower", "foxglove", "ros", "whep", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.10"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
ble = ["bleak>=0.22"]

[project.urls]
Homepage = "https://github.com/mikey0000/PyAirseekers"
Documentation = "https://github.com/mikey0000/PyAirseekers/tree/main/docs"

[dependency-groups]
dev = [
    "packaging>=24.0",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyairseekers"]

[tool.hatch.build.targets.sdist]
exclude = [".coverage", ".claude", ".pre-commit-config.yaml"]

[tool.ruff]
required-version = ">=0.8"
line-length = 120
target-version = "py313"
exclude = [".venv", ".claude"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",  # no copyright headers; LICENSE covers it
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "E501",    # formatter owns line length
    "COM812",  # conflicts with formatter
    "ISC001",  # conflicts with formatter
    "TRY003",  # exception messages are built at the raise site (exceptions.py owns the types)
    "EM101",   # same
    "EM102",
    "PLR2004", # fires on HTTP statuses and wire codes that are named by context
    "FIX002",  # TODOs are allowed when they cite a backlog entry
    "TD002",   # no author on TODOs
    "TD003",   # backlog entries, not issue links
    "D105",    # magic methods are self-describing
    "D107",    # __init__ is documented by the class docstring
    "S105",    # fires on endpoint constants named *_TOKEN; tests/meta guards real secrets
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the test primitive
    "S105",    # fixture "secrets" are obviously fake
    "S106",
    "D",       # docstrings only where docs/testing.md asks (regression tests)
    "ANN401",  # fakes take Any where the real interface does
    "SLF001",  # a unit test may inspect its own module's privates
    "ARG",     # fakes accept the interface's parameters and ignore some
    "INP001",  # pytest rootdir discovery
    "PLR0913", # fixtures fan in
    "PLR0917", # parametrised cases fan in as positional arguments
    "FBT001",  # callbacks under test mirror the library's positional signatures
    "FBT003",  # struct.pack and friends take positional booleans
]
"tests/integration/fakeserver/**" = [
    "PLR0911", # a fake routes many outcomes from one handler by nature
]
"examples/**" = ["INP001"]  # scripts, not a package
# Experimental transports (D9): kept importable, not yet held to the full bar
"pyairseekers/{mqtt,ble}.py" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["pyairseekers", "tests"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["pyairseekers"]
exclude = ["pyairseekers/mqtt.py", "pyairseekers/ble.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "regression: pins a bug that escaped; seen red before the fix (docs/testing.md §7)",
    "live: talks to the real cloud or a real mower; needs AIRSEEKERS_* env vars",
]
addopts = "-m 'not live' --strict-markers -ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pyairseekers"]
omit = ["pyairseekers/mqtt.py", "pyairseekers/ble.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "\\.\\.\\.$"]
